name: Continuous integration

# Pull requests from branches in this repository would otherwise trigger
# both a push and a pull_request run for every commit; restricting push
# events to master keeps one run per change while still producing the
# master check runs the release workflow waits on.
on:
  push:
    branches: [master]
  pull_request:

# Pushing a new commit makes any still-running workflow for the same pull
# request obsolete; cancel it instead of letting it occupy runners. Other
# events get a unique group so they are never cancelled or queued.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  Test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rust:
          - 1.85.0 # MSRV
          - stable
          - nightly
    env:
      # Override the value from the rust-toolchain file
      # This is necessary because even though the correct toolchain
      # is explicitly specified for the rust-toolchain action,
      # rustup honors the rust-toolchain file over the default
      RUSTUP_TOOLCHAIN: ${{ matrix.rust }}
    steps:
      - name: "Checkout repo"
        uses: actions/checkout@v7
      - name: "Install ${{ matrix.rust }} toolchain"
        uses: dtolnay/rust-toolchain@master
        with:
          # The toolchain must be specified manually, as this action ignores the rust-toolchain override
          # https://github.com/dtolnay/rust-toolchain?tab=readme-ov-file#inputs
          toolchain: ${{ matrix.rust }}
      - name: "Install nix"
        uses: DeterminateSystems/determinate-nix-action@main
      - name: "Use nix cache"
        uses: DeterminateSystems/magic-nix-cache-action@main
      - name: "Add nginxWithStream to PATH"
        run: |
          # This is necessary for payjoin-mailroom integration tests
          echo "$(nix build .#nginx-with-stream --print-out-paths --no-link)/bin" >> $GITHUB_PATH
      - name: "Use cache"
        uses: Swatinem/rust-cache@v2
        with:
          # Caches saved on a pull request branch are visible only to that
          # pull request and duplicate the master entry; with three
          # toolchains at ~1.5 GB each they overflow the repository's 10 GB
          # cache budget and evict other workflows' caches. Save only from
          # master, which every branch can restore.
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - name: Run tests
        run: RUST_LOG=debug bash contrib/test.sh

  Lint:
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout repo"
        uses: actions/checkout@v7
      - name: "Use cache"
        uses: Swatinem/rust-cache@v2
        with:
          # Caches saved on a pull request branch are visible only to that
          # pull request and duplicate the master entry; with three
          # toolchains at ~1.5 GB each they overflow the repository's 10 GB
          # cache budget and evict other workflows' caches. Save only from
          # master, which every branch can restore.
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - name: "Install nix"
        uses: DeterminateSystems/determinate-nix-action@main
      - name: "Use nix cache"
        uses: DeterminateSystems/magic-nix-cache-action@main
      - name: "Run code linting"
        run: nix develop -c ./contrib/lint.sh
      - name: "Run documentation linting"
        run: nix develop -c -- bash -c 'RUSTDOCFLAGS="-D warnings" cargo doc --no-deps --all-features --document-private-items'

  Coverage:
    name: Code coverage
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    env:
      # Override the value from the rust-toolchain file
      # This is necessary because even though the correct toolchain
      # is explicitly specified for the rust-toolchain action,
      # rustup honors the rust-toolchain file over the default
      RUSTUP_TOOLCHAIN: stable
    steps:
      - name: "Checkout repo"
        uses: actions/checkout@v7
      - name: "Install toolchain"
        # rust-cache usage with stable Rust is most effective, as a cache is tied to the Rust version
        uses: dtolnay/rust-toolchain@stable
      - name: "Install nix"
        uses: DeterminateSystems/determinate-nix-action@main
      - name: "Use nix cache"
        uses: DeterminateSystems/magic-nix-cache-action@main
      - name: "Add nginxWithStream to PATH"
        run: |
          # This is necessary for payjoin-mailroom integration tests
          echo "$(nix build .#nginx-with-stream --print-out-paths --no-link)/bin" >> $GITHUB_PATH
      - name: "Use cache"
        uses: Swatinem/rust-cache@v2
        with:
          # Caches saved on a pull request branch are visible only to that
          # pull request and duplicate the master entry; with three
          # toolchains at ~1.5 GB each they overflow the repository's 10 GB
          # cache budget and evict other workflows' caches. Save only from
          # master, which every branch can restore.
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - name: "Install cargo-llvm-cov"
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: "Generate code coverage for tests"
        run: bash contrib/coverage.sh
      - name: "Upload report to coveralls"
        uses: coverallsapp/github-action@v2
        with:
          fail-on-error: false

  CodeSpell:
    name: Code spell check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: codespell-project/actions-codespell@v2

  DiffMutants:
    name: Diff cargo-mutants
    # The diff is taken against the pull request base branch; on other
    # events base_ref is empty and the job mutates an empty diff.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - name: "Checkout repo"
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # required for full diff context
      - name: Fetch base branch for diff
        run: git fetch origin ${{ github.base_ref }}
      - name: Relative diff
        run: |
          git branch -av
          git diff origin/${{ github.base_ref }}.. -- '*.rs' | tee git.diff
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-mutants@27.1.0
      - name: "Install toolchain"
        uses: dtolnay/rust-toolchain@stable
      - name: "Use cache"
        uses: Swatinem/rust-cache@v2
        with:
          # This job only runs on pull requests, so it can never save a
          # cache that other branches could see. Restore the stable Test
          # job's master cache instead of keeping a per-branch copy; both
          # jobs build the workspace with the stable toolchain.
          shared-key: Test
          save-if: false
      - name: Run cargo-mutants on diff
        run: >
          cargo mutants --no-shuffle --in-diff git.diff
          --test-tool=cargo --timeout=500 --build-timeout=500
      - name: Upload mutants.out
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mutants-incremental-cargo.out
          path: mutants.out

  Fuzz:
    name: Fuzz build
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout repo"
        uses: actions/checkout@v7
      - name: "Install nightly toolchain"
        uses: dtolnay/rust-toolchain@nightly
      - name: "Use cache"
        uses: Swatinem/rust-cache@v2
        with:
          # Caches saved on a pull request branch are visible only to that
          # pull request and duplicate the master entry; with three
          # toolchains at ~1.5 GB each they overflow the repository's 10 GB
          # cache budget and evict other workflows' caches. Save only from
          # master, which every branch can restore.
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - name: "Build fuzz targets"
        run: cd fuzz && cargo build
